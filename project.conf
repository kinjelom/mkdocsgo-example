# ---------------------------------------------------------------------------
# mkdocsgo-example - project coordinates
#
# Two questions, one file:
#
#   1. WHICH mkdocsgo does this documentation run on?  MKDOCSGO_*
#   2. WHAT image does this repository publish?        REGISTRY / IMAGE_*
#
# Read by scripts/*.sh via scripts/lib.sh.
#
# Format: KEY=VALUE, one per line. No spaces around '=', no quotes, no shell
# expansion - the file is parsed, never executed. Lines starting with '#' and
# empty lines are ignored. Every key must have a value; the literal `none`
# means "not set". Environment beats the file, everywhere.
#
# Credentials are NEVER stored here. They come from the environment:
#   REGISTRY_USER / REGISTRY_PASSWORD, or GITHUB_TOKEN for ghcr.io,
#   CF_DOCKER_PASSWORD for a Cloud Foundry Docker push.
# ---------------------------------------------------------------------------

# --- 1. The server ----------------------------------------------------------

# The mkdocsgo release this project runs on. Pinned on purpose: the server is
# a dependency like any other, and "latest" would mean the documentation
# changes behaviour when someone else cuts a release.
#
# To upgrade: change this line, run scripts/run.sh, commit. That is the whole
# upgrade procedure, and the diff says exactly what changed.
MKDOCSGO_VERSION=0.1.1

# Where the release lives. Used to build the download URL:
#   https://github.com/<repo>/releases/download/v<version>/<archive>
MKDOCSGO_REPO=kinjelom/mkdocsgo

# Cloud Foundry cells run linux/amd64, so that is what is packaged - whatever
# the workstation assembling the package happens to be.
MKDOCSGO_PLATFORM=linux/amd64

# The server image, used as a build stage in the Dockerfile. Same version.
MKDOCSGO_IMAGE=ghcr.io/kinjelom/mkdocsgo

# Where to download release archives from, when GitHub is not reachable. The
# files are expected under <base>/v<version>/, named exactly as the release
# names them. `none` uses the GitHub release of MKDOCSGO_REPO.
#
# The SHA-256 check applies either way, so a mirror is a convenience and not
# something that has to be trusted.
MKDOCSGO_DOWNLOAD_BASE=none

# --- 2. The build toolbox ---------------------------------------------------

# Everything needed to test this documentation and assemble a package from it
# lives in one published image: the MkDocs toolchain and the shared build
# logic. This repository holds content and configuration, not a copy of that
# logic.
#
# What the image saves a workstation is Python. What it does not carry is the
# machine's own tooling - the container engine that runs it, and the `cf`
# client that pushes what it produced. The image has its own repository -
# https://github.com/kinjelom/mkdocs-build-toolbox - and is pinned here like
# any other dependency.
TOOLBOX_IMAGE=ghcr.io/kinjelom/mkdocs-build-toolbox:0.2.0

# --- 3. What this repository publishes --------------------------------------

# Application name; must match the one in the Cloud Foundry manifests.
#
# The version is deliberately NOT here. It is `extra.app_version` in
# mkdocs.yml - the file that belongs to the documentation itself - and
# everything that needs it reads it from there: the image tag, the OCI version
# label, and the `.version` stamp in a buildpack package (Cloud Foundry has no
# tag to carry it).
APP_NAME=mkdocsgo-example

# --- 4. The container image (an alternative to the buildpack) ----------------

# Container registry host - no scheme. Use `none` for Docker Hub.
REGISTRY=ghcr.io
IMAGE_NAMESPACE=kinjelom
IMAGE_NAME=mkdocsgo-example

# The image tag is the documentation version, from `extra.app_version` in
# mkdocs.yml. Bump it there on every published change; there is no second
# number here to keep in step.

# Moving tag pushed beside the version. `none` publishes the version only.
IMAGE_LATEST_TAG=latest

# --- 3. Local ports ---------------------------------------------------------

# Host port used by scripts/run.sh and scripts/image.sh.
LOCAL_PORT=8000

# Port the server listens on inside the container. Must match DOC_PORT in
# deploy/cf/manifest-docker.yml and containerPort in deploy/k8s/deployment.yaml.
CONTAINER_PORT=8080

# --- 4. Base images ---------------------------------------------------------

RUNTIME_BASE_IMAGE=gcr.io/distroless/static-debian12:nonroot
