# ---------------------------------------------------------------------------
# mkdocsgo-example - Ingress
#
# TLS terminates here. mkdocsgo speaks plain HTTP and has no certificate
# handling: in every platform it runs on, something in front already terminates
# TLS - the Cloud Foundry router, this Ingress, a reverse proxy - and doing it
# twice buys nothing.
#
# Both halves are one service on one port, so `/` covers the site, /mcp and
# /healthz alike.
#
# The host below must appear in `hosts:` in mkdocsgo.yml - an address no zone
# claims is answered with 403 rather than served. Here it belongs to the
# restricted zone, so both halves ask for credentials: a browser for a
# password, an agent for a bearer token.
#
# Adjust ingressClassName, the host and the issuer to your cluster.
# ---------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mkdocsgo-example
  labels:
    app.kubernetes.io/name: mkdocsgo-example
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - docs.example.com
      secretName: mkdocsgo-example-tls
  rules:
    - host: docs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mkdocsgo-example
                port:
                  name: http
